[package]
name = "koil"
version = "0.1.0"
edition = "2024"

[dependencies]
globset = "0.4"
ignore = "0.4.33"
pathfinding = "4.16"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
trash = "5.2.9"
typed-builder = "0.23.2"

# `trash` can not restore on macOS, so koil trashes there itself, to know where the item went
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3.27.0"
